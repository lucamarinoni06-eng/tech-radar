name: Aggiorna dati
on:
  schedule:
    - cron: "0 5 * * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Scarica i dati
        run: python scripts/fetch.py
        env:
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
          EPO_KEY: ${{ secrets.EPO_KEY }}
          EPO_SECRET: ${{ secrets.EPO_SECRET }}
          USPTO_API_KEY: ${{ secrets.USPTO_API_KEY }}
      - name: Salva le modifiche
        run: |
          git config user.name "tech-radar-bot"
          git config user.email "bot@users.noreply.github.com"
          git add docs/data/live
          if ! git diff --cached --quiet; then
            git commit -m "Aggiornamento dati"
            git push
          fi
